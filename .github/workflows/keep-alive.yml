name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 * * * *" # 毎時実行
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Insert keepalive record
        id: insert
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"note\": \"keepalive from GitHub Actions\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log")

          echo "===== SUPABASE RESPONSE ====="
          echo "$RESPONSE"

          # 配列でもオブジェクトでも対応
          ID=$(echo "$RESPONSE" | jq -r 'if type=="array" then .[0].id else .id end')

          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Delete keepalive record
        if: steps.insert.outputs.id != ''
        run: |
          curl -s -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log?id=eq:${{ steps.insert.outputs.id }}"

      - name: Log when no ID is returned
        if: steps.insert.outputs.id == ''
        run: echo "Insert succeeded but no ID was returned. Nothing to delete."
