name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 * * * *" # 毎時実行
  workflow_dispatch: # 手動実行可能

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keepalive record
        run: |
          curl -s -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"note\": \"keepalive from GitHub Actions\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log"

      - name: Delete oldest keepalive record
        run: |
          # 最も古い1件を取得
          OLDEST_ID=$(curl -s -X GET \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log?select=id&order=created_at.asc&limit=1" \
            | jq -r '.[0].id')

          # ID があれば削除
          if [ "$OLDEST_ID" != "null" ] && [ -n "$OLDEST_ID" ]; then
            curl -s -X DELETE \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log?id=eq.${OLDEST_ID}"
          fi
