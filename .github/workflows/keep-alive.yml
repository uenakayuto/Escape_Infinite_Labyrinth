name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 * * * *" # 毎時
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Insert keepalive record
        id: insert
        run: |
          RESPONSE=$(curl -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"note\": \"keepalive from GitHub Actions\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log")

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          ID=$(echo "$RESPONSE" | jq -r '.[0].id')
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Delete keepalive record
        run: |
          curl -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_log?id=eq:${{ steps.insert.outputs.id }}"
